name: Deploy Ellevie Studio to OVH

on:
  workflow_dispatch:
    inputs:
      send_studio_reset:
        description: Send a Studio reset link to the stored private recovery address
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-ovh-studio.yml

permissions:
  contents: read

concurrency:
  group: deploy-ellevie-studio-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the verified Studio source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 9ba6e5002700ba7fb4ce399d4101fa850d0f4f02
          persist-credentials: false

      - name: Validate the Studio source
        run: |
          set -euo pipefail
          php -l ovh-studio/app/bootstrap.php
          grep -Fq "no-reply@studio.ellevie.fr" ovh-studio/app/bootstrap.php
          php -l ovh-studio/public/index.php
          php -l ovh-studio/public/iphone/index.php
          node --check ovh-studio/public/form.js
          node --check ovh-studio/public/mot-de-passe-oublie.js
          node --check ovh-studio/public/studio.js
          grep -Fq 'studio_user_schema_version' ovh-studio/app/bootstrap.php
          grep -Fq 'id="user-create-form"' ovh-studio/public/studio.html
          node --check ovh-studio/public/iphone/app.js
          grep -Fxq 'Disallow: /' ovh-studio/public/robots.txt
          for page in \
            ovh-studio/public/envoyer.html \
            ovh-studio/public/studio.html \
            ovh-studio/public/confidentialite.html \
            ovh-studio/public/mot-de-passe-oublie.html \
            ovh-studio/public/iphone/index.html; do
            grep -Fq 'noindex, nofollow, noarchive, nosnippet, noimageindex' "$page"
            grep -Fq 'name="referrer" content="no-referrer"' "$page"
          done

      - name: Install the SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends sshpass

      - name: Upload the Studio update to OVH
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"

          sshpass -e sftp \
            -P 22 \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "$OVH_SFTP_USER@$OVH_SFTP_HOST" <<'SFTP'
          put ovh-studio/app/web_push.php ellevie-studio/app/web_push.php
          put ovh-studio/app/bootstrap.php ellevie-studio/app/bootstrap.php
          put ovh-studio/database/schema.sql ellevie-studio/database/schema.sql
          put ovh-studio/public/styles.css ellevie-studio/public/styles.css
          put ovh-studio/public/robots.txt ellevie-studio/public/robots.txt
          put ovh-studio/public/studio.html ellevie-studio/public/studio.html
          put ovh-studio/public/index.php ellevie-studio/public/index.php
          put ovh-studio/public/studio.js ellevie-studio/public/studio.js
          put ovh-studio/public/confidentialite.html ellevie-studio/public/confidentialite.html
          put ovh-studio/public/envoyer.html ellevie-studio/public/envoyer.html
          put ovh-studio/public/form.js ellevie-studio/public/form.js
          put ovh-studio/public/mot-de-passe-oublie.html ellevie-studio/public/mot-de-passe-oublie.html
          put ovh-studio/public/mot-de-passe-oublie.js ellevie-studio/public/mot-de-passe-oublie.js
          -mkdir ellevie-studio/public/iphone
          -mkdir ellevie-studio/public/iphone/assets
          put ovh-studio/public/iphone/index.html ellevie-studio/public/iphone/index.html
          put ovh-studio/public/iphone/index.php ellevie-studio/public/iphone/index.php
          put ovh-studio/public/iphone/app.css ellevie-studio/public/iphone/app.css
          put ovh-studio/public/iphone/app.js ellevie-studio/public/iphone/app.js
          put ovh-studio/public/iphone/manifest.webmanifest ellevie-studio/public/iphone/manifest.webmanifest
          put ovh-studio/public/iphone/sw.js ellevie-studio/public/iphone/sw.js
          put ovh-studio/public/iphone/assets/ellevie-logo.webp ellevie-studio/public/iphone/assets/ellevie-logo.webp
          put ovh-studio/public/iphone/assets/icon-180.png ellevie-studio/public/iphone/assets/icon-180.png
          put ovh-studio/public/iphone/assets/icon-192.png ellevie-studio/public/iphone/assets/icon-192.png
          put ovh-studio/public/iphone/assets/icon-512.png ellevie-studio/public/iphone/assets/icon-512.png
          put ovh-studio/public/iphone/assets/maya.webp ellevie-studio/public/iphone/assets/maya.webp
          put ovh-studio/public/iphone/assets/nora.webp ellevie-studio/public/iphone/assets/nora.webp
          put ovh-studio/public/iphone/assets/sofia.webp ellevie-studio/public/iphone/assets/sofia.webp
          SFTP

      - name: Request a reset link for the stored private Studio address
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_studio_reset }}
        env:
          OVH_SFTP_HOST: ${{ secrets.OVH_SFTP_HOST }}
          OVH_SFTP_PASSWORD: ${{ secrets.OVH_SFTP_PASSWORD }}
          OVH_SFTP_USER: ${{ secrets.OVH_SFTP_USER }}
          SSHPASS: ${{ secrets.OVH_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OVH_SFTP_HOST"
          test -n "$OVH_SFTP_USER"
          test -n "$OVH_SFTP_PASSWORD"

          studio_config="$RUNNER_TEMP/ellevie-config.local.php"
          cookie_jar="$RUNNER_TEMP/ellevie-recovery-cookies.txt"
          config_response="$RUNNER_TEMP/ellevie-config-response.json"
          recovery_response="$RUNNER_TEMP/ellevie-recovery-response.json"
          cleanup() {
            rm -f "$studio_config" "$cookie_jar" "$config_response" "$recovery_response"
          }
          trap cleanup EXIT

          sshpass -e sftp \
            -P 22 \
            -o BatchMode=no \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "$OVH_SFTP_USER@$OVH_SFTP_HOST" <<SFTP
          get ellevie-studio/config.local.php $studio_config
          SFTP

          install_key="$(php -r '
            $config = require $argv[1];
            $key = is_array($config) ? (string) ($config["install_key"] ?? "") : "";
            if (strlen($key) < 32 || str_starts_with($key, "VERVANG_")) {
                fwrite(STDERR, "The private Studio install key is missing or invalid.\n");
                exit(1);
            }
            echo $key;
          ' "$studio_config")"
          echo "::add-mask::$install_key"

          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache' \
            'https://studio.ellevie.fr/api/config' \
            > "$config_response"
          form_token="$(jq -r '.formToken // empty' "$config_response")"
          test -n "$form_token"
          echo "::add-mask::$form_token"

          payload="$(jq -cn \
            --arg formToken "$form_token" \
            --arg installKey "$install_key" \
            '{formToken: $formToken, installKey: $installKey}')"
          status="$(curl --silent --show-error \
            --output "$recovery_response" \
            --write-out '%{http_code}' \
            --cookie "$cookie_jar" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://studio.ellevie.fr' \
            --data "$payload" \
            'https://studio.ellevie.fr/api/studio/recovery/bootstrap')"

          if [[ "$status" != '202' ]] || [[ "$(jq -r '.ok // false' "$recovery_response")" != 'true' ]]; then
            error_message="$(jq -r '.error // "The Studio recovery action failed."' "$recovery_response")"
            echo "$error_message" >&2
            exit 1
          fi
          echo 'The Studio reset request was accepted for the stored private recovery address.'

      - name: Verify the live Studio version
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if root_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/?deploy=${GITHUB_SHA}-${attempt}")" \
              && reset_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/mot-de-passe-oublie?type=listener&deploy=${GITHUB_SHA}-${attempt}")" \
              && studio_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/studio?deploy=${GITHUB_SHA}-${attempt}")" \
              && privacy_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/confidentialite?deploy=${GITHUB_SHA}-${attempt}")" \
              && iphone_html="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/iphone/?deploy=${GITHUB_SHA}-${attempt}")" \
              && robots_txt="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/robots.txt?deploy=${GITHUB_SHA}-${attempt}")" \
              && manifest_json="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/iphone/manifest.webmanifest?deploy=${GITHUB_SHA}-${attempt}")" \
              && worker_js="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/iphone/sw.js?deploy=${GITHUB_SHA}-${attempt}")" \
              && push_json="$(curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://studio.ellevie.fr/api/listener/web-push-key?deploy=${GITHUB_SHA}-${attempt}")" \
              && push_key="$(jq -r '.publicKey // empty' <<<"$push_json")" \
              && [[ "$root_html" == *'form.js?v=13'* ]] \
              && [[ "$root_html" == *'id="forgot-password-button"'* ]] \
              && [[ "$root_html" == *'noindex, nofollow, noarchive, nosnippet, noimageindex'* ]] \
              && [[ "$reset_html" == *'mot-de-passe-oublie.js?v=1'* ]] \
              && [[ "$reset_html" == *'noindex, nofollow, noarchive, nosnippet, noimageindex'* ]] \
              && [[ "$studio_html" == *'/mot-de-passe-oublie?type=studio'* ]] \
              && [[ "$studio_html" == *'studio.js?v=14'* ]] \
              && [[ "$studio_html" == *'id="user-create-form"'* ]] \
              && [[ "$studio_html" == *'noindex, nofollow, noarchive, nosnippet, noimageindex'* ]] \
              && [[ "$privacy_html" == *'noindex, nofollow, noarchive, nosnippet, noimageindex'* ]] \
              && [[ "$iphone_html" == *'app.js?v=1.5.0-carplay.1'* ]] \
              && [[ "$iphone_html" == *'CarPlay privé'* ]] \
              && [[ "$iphone_html" == *'noindex, nofollow, noarchive, nosnippet, noimageindex'* ]] \
              && [[ "$robots_txt" == $'User-agent: *\nDisallow: /' ]] \
              && [[ "$manifest_json" == *'"display": "standalone"'* ]] \
              && [[ "$worker_js" == *"ellevie-iphone-v1.5.0-carplay.1"* ]] \
              && [[ "$push_key" =~ ^[A-Za-z0-9_-]{87}$ ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'The upload completed, but the expected live version was not visible.' >&2
          exit 1
