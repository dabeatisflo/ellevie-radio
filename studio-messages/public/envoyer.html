<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e50038">
    <title>Écrire au studio — Ellevie</title>
    <meta name="description" content="Envoyez un message à l'équipe d'Ellevie Radio.">
    <link rel="stylesheet" href="/styles.css">
    <script src="/form.js" defer></script>
  </head>
  <body class="listener-page">
    <main class="listener-shell">
      <header class="brand-header" aria-label="Ellevie Radio">
        <span class="brand-script">ellevie</span>
        <span class="brand-tagline">Lady's First</span>
      </header>

      <section class="listener-card chat-card" aria-labelledby="form-title">
        <div class="chat-titlebar">
          <div>
            <div class="eyebrow">EN DIRECT AVEC LE STUDIO</div>
            <h1 id="form-title">Messages</h1>
          </div>
          <span class="live-dot"><i></i> En ligne</span>
        </div>

        <div id="sent-messages" class="listener-messages" aria-live="polite">
          <div class="system-bubble">
            <strong>Bonjour&nbsp;!</strong>
            <span>Une réaction, un petit mot ou une dédicace&nbsp;? Notre équipe vous lit pendant l'émission.</span>
          </div>
        </div>

        <form id="message-form" class="message-composer" novalidate>
          <div class="name-row">
            <label for="display-name">Votre prénom</label>
            <input id="display-name" name="displayName" type="text" minlength="2" maxlength="40" autocomplete="given-name" placeholder="Prénom" required>
          </div>

          <div class="composer-row">
            <div class="composer-input">
              <label class="visually-hidden" for="message">Votre message</label>
              <textarea id="message" name="message" rows="2" minlength="2" maxlength="500" placeholder="Écrivez votre message…" required></textarea>
              <span id="character-count" class="character-count">0/500</span>
            </div>
            <button id="submit-button" class="send-button" type="submit" disabled aria-label="Envoyer au studio">➤</button>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="website">Site web</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
          </div>

          <div id="turnstile" class="turnstile-box" aria-label="Vérification de sécurité"></div>
          <p id="security-error" class="form-error" hidden></p>
          <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
        </form>

        <p class="privacy-note">
          Texte uniquement · aucun fichier · votre message n'est pas public.
          <a href="/confidentialite">Confidentialité</a>
        </p>
      </section>
    </main>
  </body>
</html>
